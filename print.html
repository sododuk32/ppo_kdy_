<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>곽대양 · 프론트엔드 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* ===== 인쇄용 포트폴리오 — 담담한 흑백 편집 스타일.
        bold 없음 · 강조색 없음 · 이탤릭 없음 · 큰 글씨 · 목차 히어로 · 숫자 카드 없음.
        내용은 portfolio-data.js 에서 읽어 요약형(프로젝트당 1P)으로 렌더. ===== */
:root{
  --ink:#1a1a1a; --gray:#6b7280; --line:#d4d9e0; --line-2:#e7eaef;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0; padding:0;}
body{font-family:Pretendard,-apple-system,system-ui,sans-serif; color:var(--ink);
  font-size:12pt; line-height:1.7; font-weight:400; background:#eef1f5;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;}
/* 담담하게 — 콘텐츠에 섞인 bold 도 정자 무게로 눌러 통일 */
b,strong{font-weight:400;}

.page{width:210mm; min-height:297mm; padding:20mm 17mm; margin:0 auto 10mm; background:#fff;
  box-shadow:0 2px 14px rgba(20,30,50,.12); position:relative;}
.page + .page{page-break-before:always;}

/* ---- 표지 + 목차(히어로) ---- */
.cover{display:flex; flex-direction:column; min-height:255mm;}
.cover .eyebrow{font-family:var(--mono); font-size:11pt; color:var(--gray); letter-spacing:.1em;}
.cover h1{font-size:24pt; font-weight:700; letter-spacing:-.01em; margin:7mm 0 2mm; line-height:1.2;}
.cover .role{font-size:15pt; color:var(--gray); margin:0;}
.cover .intro{font-size:12pt; margin:6mm 0 0; max-width:150mm; line-height:1.7;}
.cover .contact{font-family:var(--mono); font-size:10.5pt; color:var(--gray); margin-top:5mm;}
.toc-hero{margin-top:14mm; border-top:1px solid var(--ink); padding-top:7mm;}
.toc-hero .h{font-family:var(--mono); font-size:11pt; color:var(--gray); margin:0 0 5mm; letter-spacing:.02em;}
.toc-hero ol{margin:0; padding:0; list-style:none; counter-reset:t;}
.toc-hero li{counter-increment:t; display:flex; align-items:baseline; gap:5mm;
  padding:3.2mm 0; border-bottom:1px solid var(--line-2);}
.toc-hero li::before{content:counter(t,decimal-leading-zero); font-family:var(--mono);
  font-size:12pt; color:var(--gray); flex:none; width:10mm;}
.toc-hero .nm{font-size:14pt; font-weight:700;}
.toc-hero .yr{font-family:var(--mono); font-size:10.5pt; color:var(--gray); margin-left:auto;}
.cover .edu-line{font-size:10.5pt; color:var(--gray); margin-top:auto; padding-top:8mm;}

/* ---- 섹션 공통 ---- */
.sec-t{font-size:14pt; font-weight:700; margin:0 0 1mm; padding-bottom:2.6mm; border-bottom:1px solid var(--ink);}
.sec-t .en{font-family:var(--mono); font-size:10pt; font-weight:400; color:var(--gray); margin-left:3mm;}
.sub-t{font-size:14pt; font-weight:700; margin:8mm 0 3mm; padding-left:2.6mm; border-left:2px solid var(--ink);}
.intro-p{font-size:11.5pt; line-height:1.75; margin:3mm 0 0;}

/* ---- 경력 ---- */
.career{margin-top:4mm;}
.c-item{padding:3mm 0; border-top:1px solid var(--line-2);}
.c-item:first-child{border-top:0;}
.c-head{font-size:14pt; font-weight:700;}
.c-head .role{font-size:11pt; font-weight:400; color:var(--gray); margin-left:2.5mm;}
.c-head .yr{font-family:var(--mono); font-size:10pt; font-weight:400; color:var(--gray); margin-left:2.5mm;}
.c-desc{font-size:11.5pt; color:var(--ink); line-height:1.72; margin:2mm 0 0;}
.c-duties{font-size:10.5pt; color:var(--gray); margin:1.6mm 0 0;}

/* ---- 역량 ---- */
.skills{display:grid; grid-template-columns:1fr; gap:5mm; margin-top:4mm;}
.skill-card h3{font-size:14pt; font-weight:700; margin:0 0 1mm;}
.skill-card .cap{font-family:var(--mono); font-size:9.5pt; color:var(--gray); margin-bottom:2.5mm;}
.skill-card ul{margin:0; padding:0; list-style:none;}
.skill-card li{font-size:11.5pt; padding:1.4mm 0; display:flex; gap:2.6mm; align-items:baseline;}
.skill-card li::before{content:'·'; color:var(--gray); flex:none;}
.skill-card li .sk-note{color:var(--gray);}
.skill-card.sk-secondary h3{font-size:12.5pt;}
.skill-card.sk-secondary li{font-size:10pt;}

/* ---- 프로젝트 ---- */
/* 프로젝트 — 상하 배치 (헤더: 메타 / 본문: 소개+작업) */
.proj{display:block;}
.proj-side{padding-bottom:5mm; margin-bottom:8mm; border-bottom:1px solid var(--line);}
.ps-name{font-size:15pt; font-weight:700; line-height:1.3;}
.ps-year{font-family:var(--mono); font-size:10pt; color:var(--gray); margin-top:1.8mm;}
.ps-meta{font-size:10.5pt; color:var(--gray); margin-top:3mm; line-height:1.6;}
.ps-stack{font-size:10pt; color:var(--gray); margin-top:4.5mm; line-height:1.7;}
.proj-main{min-width:0;}
.pm-tagline{font-size:13pt; line-height:1.65; margin:0 0 7mm;}
.about{margin-top:3mm;}
.about .row{display:grid; grid-template-columns:22mm 1fr; gap:6mm; padding:3.4mm 0; border-top:1px solid var(--line-2);}
.about .row:first-child{border-top:0;}
.about .k{font-family:var(--mono); font-size:9.5pt; color:var(--gray); padding-top:.8mm;}
.about .v{font-size:11.5pt; line-height:1.72;}
.wbrief{margin:2mm 0 0; padding:0; list-style:none;}
.wbrief li{padding:2mm 0; border-top:1px solid var(--line-2); line-height:1.66; font-size:11.5pt;}
.wbrief li:first-child{border-top:0;}
.wbrief .wt{color:var(--ink);}
.wbrief .wb{color:var(--gray);}

/* 주요 작업 — 제목 + brief + 상세 몇 줄 (한 줄 요약보다 길게) */
.worklist{margin:2mm 0 0;}
.witem{padding:4mm 0; border-top:1px solid var(--line-2);}
.witem:first-child{border-top:0;}
.witem .wt{font-size:12pt; font-weight:700;}
.witem .wb{font-size:11.5pt; margin-top:.8mm; line-height:1.68;}
.wpf{margin:1.8mm 0 0;}
.wpfl{font-size:8.5pt; font-weight:700; color:var(--ink); letter-spacing:.03em; display:block; margin-bottom:.2mm;}
/* ---- 인쇄용 다이어그램 (흑백 · 정적 %좌표) ---- */
.pfig{margin:5mm 0 2mm; break-inside:avoid;}
.pfig-cap{font-size:8pt; color:var(--gray); margin-bottom:2.5mm;}
.diag-box{position:relative; width:100%; height:62mm;}
.diag-box .dzone{position:absolute; border:0.3mm dashed #c2c8d2; border-radius:1.5mm;}
.diag-box .dzone-l{position:absolute; top:-1.7mm; left:2mm; font-size:6.5pt; color:var(--gray); background:#fff; padding:0 0.8mm;}
.diag-box .node{position:absolute; transform:translate(-50%,-50%); max-width:30mm; text-align:center; line-height:1.15; font-size:7pt; color:var(--ink); background:#fff; border:0.3mm solid var(--ink); border-radius:1.2mm; padding:0.8mm 1.4mm;}
.diag-box .node.ext{border-style:dashed; color:#555;}
.diag-box .node.db{border-radius:3mm;}
.diag-box .dsvg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
.diag-box .de{fill:none; stroke:#1a1a1a; stroke-width:0.35mm; opacity:.5;}
.diag-box .delabel{position:absolute; transform:translate(-50%,-50%); font-size:6pt; color:var(--gray); background:#fff; padding:0 0.5mm; white-space:nowrap;}
.side-pfig{margin:4mm 0 2mm; break-inside:avoid;}
.side-pfig img{width:100%; display:block; border:0.3mm solid var(--line); border-radius:1.5mm;}
.side-pfig figcaption{font-size:8pt; color:var(--gray); margin-top:2mm;}
.side-repos{font-size:8.5pt; color:var(--gray); margin-top:2.5mm;}
.wd{margin:1.4mm 0 0 0; padding-left:5mm; list-style:none;}
.wd li{position:relative; padding:.5mm 0; font-size:11pt; color:var(--gray); line-height:1.62;}
.wd li::before{content:'·'; position:absolute; left:-3.2mm;}

/* ---- 화면 전용 안내 (인쇄에서는 사라짐) ---- */
.howto{max-width:210mm; margin:8mm auto; padding:6mm 8mm; background:#fff; border:1px solid var(--line);
  border-radius:3mm; font-size:11.5pt; color:var(--ink); line-height:1.75;}
.howto code{font-family:var(--mono); background:#f2f4f8; padding:.5mm 1.6mm; border-radius:1mm;}

@media print{
  body{background:#fff;}
  .page{box-shadow:none; margin:0; width:auto; min-height:0; padding:0;}
  .howto{display:none;}
  @page{size:A4; margin:18mm 15mm;}
}
</style>
</head>
<body>

<div class="howto" data-i18n-html="p_howto">
  PDF로 저장: <code>Ctrl+P</code> → 대상 <b>“PDF로 저장”</b> → 추가 설정 <b>“배경 그래픽” 체크</b> · 용지 A4 · 여백 기본.
  이 안내 박스는 인쇄물에는 나오지 않습니다.
</div>

<div id="doc"></div>

<script src="i18n.js"></script>
<script src="portfolio-data.js"></script>
<script>
(function(){
  var t=window.I18N.t, tr=window.I18N.tr;
  /* 연락처 — 공개 가능(이미 제출 이력). 인쇄용 포폴이므로 포트폴리오 URL 포함. */
  var PROFILE = {
    name:'곽대양',
    role:t('hero_role'),
    intro:t('hero_tag'),
    summary:t('p_summary'),
    phone:'010-8011-8429',
    email:'sododuk63@gmail.com',           /* 확인 필요 */
    github:'github.com/sododuk32',
    site:'sododuk32.github.io/ppo_kdy_',
    edu:t('p_edu'),
    activities:[]                          /* 외부활동 — 인쇄용 내용 받으면 채움 */
  };

  var esc = function(s){ return String(s==null?'':s); };
  var arr = function(v){ return v==null ? [] : (Array.isArray(v)?v:[v]); };

  /* ---- 표지 + 목차(히어로) ---- */
  function cover(){
    var toc = (window.PROJECTS||[]).map(function(p){
      return '<li><span class="nm">'+esc(tr(p.name))+'</span><span class="yr">'+esc(p.year)+'</span></li>';
    }).join('');
    var contact = [
      PROFILE.phone,
      PROFILE.email,
      PROFILE.github ? 'GitHub  ' + PROFILE.github : '',
      PROFILE.site ? t('p_web') + '  ' + PROFILE.site : ''
    ].filter(Boolean).join('   ·   ');
    return '<div class="page cover">'+
      '<div class="eyebrow">FRONTEND PORTFOLIO</div>'+
      '<h1>'+esc(PROFILE.name)+'</h1>'+
      '<p class="role">'+esc(PROFILE.role)+'</p>'+
      (PROFILE.intro?'<p class="intro">'+esc(PROFILE.intro)+'</p>':'')+
      '<div class="contact">'+contact+'</div>'+
      '<div class="toc-hero"><p class="h">/* '+esc(t('p_toc'))+' */</p><ol>'+toc+'</ol></div>'+
      (PROFILE.edu?'<div class="edu-line">'+esc(PROFILE.edu)+'</div>':'')+
    '</div>';
  }

  /* ---- 자기소개 · 경력 · 역량 · 외부활동 ---- */
  function intro(){
    if(!PROFILE.summary) return '';
    return '<h2 class="sec-t">'+esc(t('p_about_me'))+'<span class="en">/* about me */</span></h2>'+
      '<p class="intro-p">'+esc(PROFILE.summary)+'</p>';
  }
  function careerBlock(){
    var items = (window.CAREER||[]).map(function(c){
      var duties = (c.duties||[]).map(tr).join(' · ');
      return '<div class="c-item"><div class="c-head">'+esc(tr(c.co))+
        '<span class="role">'+esc(tr(c.role))+'</span><span class="yr">'+esc(c.yr)+'</span></div>'+
        (c.desc?'<p class="c-desc">'+esc(tr(c.desc))+'</p>':'')+
        (duties?'<div class="c-duties">'+esc(duties)+'</div>':'')+'</div>';
    }).join('');
    return '<h2 class="sec-t" style="margin-top:12mm">'+esc(t('nav_career'))+'<span class="en">/* career */</span></h2>'+
      '<div class="career">'+items+'</div>';
  }
  function skillsBlock(){
    var cards = (window.SKILLS||[]).map(function(s){
      var rows = (s.rows||[]).map(function(r){
        return '<li>'+esc(tr(r.nm))+(r.note?' <span class="sk-note">— '+esc(tr(r.note))+'</span>':'')+'</li>';
      }).join('');
      return '<div class="skill-card'+(s.sub!=='frontend'?' sk-secondary':'')+'"><h3>'+esc(tr(s.title))+'</h3>'+
        '<ul>'+rows+'</ul></div>';
    }).join('');
    return '<h2 class="sec-t" style="margin-top:12mm">'+esc(t('sec2_h'))+'<span class="en">/* skills */</span></h2>'+
      '<div class="skills">'+cards+'</div>';
  }
  function activitiesBlock(){
    if(!(PROFILE.activities||[]).length) return '';
    var items = PROFILE.activities.map(function(a){ return '<li>'+esc(tr(a))+'</li>'; }).join('');
    return '<h2 class="sec-t" style="margin-top:12mm">'+esc(t('p_activities'))+'<span class="en">/* activities */</span></h2>'+
      '<ul class="wbrief">'+items+'</ul>';
  }
  function page2(){
    return '<div class="page">'+ intro() + careerBlock() + skillsBlock() + activitiesBlock() +'</div>';
  }

  /* ---- 인쇄용 다이어그램: %좌표 그대로, viewBox 0-100 + non-scaling-stroke 로 스케일 안정 ---- */
  function diagPrintHTML(fig){
    if(!fig || !fig.nodes || !fig.nodes.length) return '';
    var zones = (fig.zones||[]).map(function(z){
      return '<div class="dzone" style="left:'+z.x+'%;top:'+z.y+'%;width:'+z.w+'%;height:'+z.h+'%"><span class="dzone-l">'+esc(tr(z.label))+'</span></div>';
    }).join('');
    var nodes = (fig.nodes||[]).map(function(n){
      return '<div class="node '+(n.t||'')+'" style="left:'+n.x+'%;top:'+n.y+'%">'+esc(tr(n.l))+'</div>';
    }).join('');
    var paths='', labels='';
    (fig.edges||[]).forEach(function(e){
      var a=fig.nodes[e[0]], b=fig.nodes[e[1]], opt=e[2];
      if(!a||!b) return;
      var ax=a.x, ay=a.y, bx=b.x, by=b.y, dx=(bx-ax)*0.5;
      paths += '<path class="de" d="M '+ax+' '+ay+' C '+(ax+dx)+' '+ay+', '+(bx-dx)+' '+by+', '+bx+' '+by+'" vector-effect="non-scaling-stroke"/>';
      var label = (opt && typeof opt==='object' && opt.label) ? tr(opt.label) : '';
      if(label) labels += '<span class="delabel" style="left:'+((ax+bx)/2)+'%;top:'+((ay+by)/2)+'%">'+esc(label)+'</span>';
    });
    return '<div class="pfig">'+(fig.title?'<div class="pfig-cap">'+esc(tr(fig.title))+'</div>':'')+
      '<div class="diag-box">'+zones+
      '<svg class="dsvg" viewBox="0 0 100 100" preserveAspectRatio="none">'+paths+'</svg>'+
      nodes+labels+'</div></div>';
  }

  /* ---- 프로젝트 1개 = 새 페이지 · 2단 배치 (좌: 메타 / 우: 소개 + 주요 작업) ---- */
  function project(p, idx){
    var a = p.about||{}, m = a.meta||{};

    var side = '<div class="proj-side">'+
      '<div class="ps-name">'+(idx+1)+'. '+esc(tr(p.name))+'</div>'+
      (p.year?'<div class="ps-year">'+esc(p.year)+'</div>':'')+
      (m.period?'<div class="ps-meta">'+esc(t('p_period'))+' · '+esc(tr(m.period))+'</div>':'')+
      (m.team?'<div class="ps-meta">'+esc(t('p_team'))+' · '+esc(tr(m.team))+'</div>':'')+
      (m.client?'<div class="ps-meta">'+esc(t('p_client'))+' · '+esc(tr(m.client))+'</div>':'')+
      (p.struct?'<div class="ps-meta">'+esc(t('p_struct'))+' · '+esc(tr(p.struct))+'</div>':'')+
      ((p.stack||[]).length?'<div class="ps-stack">'+esc(t('p_stack'))+' · '+p.stack.map(function(s){return esc(tr(s));}).join(' · ')+'</div>':'')+
    '</div>';

    var aboutRows = [['what','about_what'],['problem','about_problem'],['role','about_role'],['outcome','about_outcome']]
      .filter(function(kv){ return a[kv[0]]; })
      .map(function(kv){ return '<div class="row"><div class="k">'+esc(t(kv[1]))+'</div><div class="v">'+esc(tr(a[kv[0]]))+'</div></div>'; })
      .join('');

    var main = '<div class="proj-main">';
    if(a.tagline) main += '<div class="pm-tagline">'+esc(tr(a.tagline))+'</div>';
    if(aboutRows) main += '<h3 class="sub-t" style="margin-top:0">'+esc(t('about_h'))+'</h3><div class="about">'+aboutRows+'</div>';

    /* 주요 작업 — 제목 + brief + 상세 최대 3줄. 도면·전체 detail은 웹에서. */
    var works = (p.work||[]).filter(function(w){ return w && typeof w==='object'; });
    if(works.length){
      main += '<h3 class="sub-t"'+(aboutRows?'':' style="margin-top:0"')+'>'+esc(t('p_main_work'))+'</h3><div class="worklist">';
      var pfield = function(label,val){
        var items = arr(val).filter(Boolean);
        if(!items.length) return '';
        return '<div class="wpf"><span class="wpfl">'+esc(label)+'</span><ul class="wd">'+
          items.map(function(x){ return '<li>'+esc(tr(x))+'</li>'; }).join('')+'</ul></div>';
      };
      works.forEach(function(w){
        main += '<div class="witem"><div class="wt">'+esc(tr(w.title))+'</div>';
        if(w.brief) main += '<div class="wb">'+esc(tr(w.brief))+'</div>';
        var hasNew = w.background || w.solution || w.result || w.retro;
        if(hasNew){
          main += pfield(t('f_bg'), w.background);
          main += pfield(t('f_sol'), w.solution);
          (w.figures||[]).forEach(function(f){ if(f&&f.print) main += diagPrintHTML(f); });
          main += pfield(t('f_res'), w.result);
          main += pfield(t('f_retro'), w.retro);
        } else {
          var lines = [];
          if(w.detail) lines = arr(w.detail);
          else if(w.sections) (w.sections||[]).forEach(function(s){ (s.items||[]).forEach(function(it){ lines.push(it); }); });
          lines = lines.slice(0,3);
          if(lines.length) main += '<ul class="wd">'+lines.map(function(x){ return '<li>'+esc(tr(x))+'</li>'; }).join('')+'</ul>';
          (w.figures||[]).forEach(function(f){ if(f&&f.print) main += diagPrintHTML(f); });
        }
        main += '</div>';
      });
      main += '</div>';
    }
    main += '</div>';

    return '<div class="page proj">'+side+main+'</div>';
  }

  function sideProjectsBlock(){
    var list = (window.SIDE_PROJECTS||[]);
    if(!list.length) return '';
    var pf = function(label,val){
      var its = arr(val).filter(Boolean);
      if(!its.length) return '';
      return '<div class="wpf"><span class="wpfl">'+esc(label)+'</span><ul class="wd">'+its.map(function(x){ return '<li>'+esc(tr(x))+'</li>'; }).join('')+'</ul></div>';
    };
    var items = list.map(function(p){
      var stack = (p.stack||[]).map(tr).join(' · ');
      var repos = p.repos || (p.repo?[{l:t('p_repo'),u:p.repo}]:[]);
      return '<div class="c-item"><div class="c-head">'+esc(tr(p.name))+
        '<span class="yr">'+esc(p.year)+'</span></div>'+
        (p.tagline?'<p class="c-desc">'+esc(tr(p.tagline))+'</p>':'')+
        pf(t('f_bg'), p.background)+
        pf(t('f_sol'), p.solution)+
        pf(t('f_res'), p.result)+
        (p.img?'<figure class="side-pfig"><img src="'+esc(p.img)+'" alt="'+esc(t('side_arch_default'))+'">'+(p.imgCap?'<figcaption>'+esc(tr(p.imgCap))+'</figcaption>':'')+'</figure>':'')+
        (stack?'<div class="c-duties">'+esc(stack)+'</div>':'')+
        (repos.length?'<div class="side-repos">'+repos.map(function(r){ return esc(tr(r.l))+' · '+esc(r.u.replace(/^https?:\/\//,'')); }).join('     ·     ')+'</div>':'')+'</div>';
    }).join('');
    return '<h2 class="sec-t">'+esc(t('sec4_h'))+'<span class="en">/* side projects */</span></h2>'+
      '<div class="career">'+items+'</div>';
  }

  var html = cover() + page2();
  (window.PROJECTS||[]).forEach(function(p,i){ html += project(p,i); });
  var sp = sideProjectsBlock();
  if(sp) html += '<div class="page">'+sp+'</div>';
  document.getElementById('doc').innerHTML = html;
})();
</script>
</body></html>
